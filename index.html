<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Craftland Map Library — Free Fire Custom Maps</title>
<meta name="description" content="Browse, search and copy the best Free Fire Craftland map codes — esports arenas, parkour runs, horror maps and more.">
<meta name="theme-color" content="#0a0e14">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="container">
    <a href="#top" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#160702" stroke-width="2.2">
          <path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5z"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Craftland<span style="color:var(--ember)">Lib</span></span>
        <span class="brand-tag">Free Fire Map Library</span>
      </span>
    </a>
    <div class="header-social">
      <a class="social-btn youtube" href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="Our YouTube channel">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.4 3.5 12 3.5 12 3.5s-7.4 0-9.4.6A3 3 0 00.5 6.2 31 31 0 000 12a31 31 0 00.5 5.8 3 3 0 002.1 2.1c2 .6 9.4.6 9.4.6s7.4 0 9.4-.6a3 3 0 002.1-2.1A31 31 0 0024 12a31 31 0 00-.5-5.8zM9.6 15.5v-7l6.3 3.5-6.3 3.5z"/></svg>
      </a>
      <a class="social-btn instagram" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Our Instagram page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
  </div>
</header>

<main id="top">

  <!-- ============ SEARCH ZONE ============ -->
  <section class="search-zone container">
    <span class="eyebrow"><span class="dot"></span>Live Library · Updated Daily</span>
    <h1>Find your next <span>Craftland</span> map</h1>

    <div class="search-bar">
      <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search by title, description, map code or category…" autocomplete="off" inputmode="search">
      <button type="button" id="searchClear" class="search-clear" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="result-meta" id="resultMeta">Loading maps…</p>
  </section>

  <!-- ============ CATEGORY FILTERS ============ -->
  <div class="filter-bar-wrap">
    <nav class="filter-bar" id="filterBar" aria-label="Filter by category"></nav>
  </div>

  <!-- ============ MAP GRID ============ -->
  <section class="map-section container">
    <div class="map-grid" id="mapGrid"></div>
  </section>

</main>

<!-- ============ FOOTER ============ -->
<footer class="site-footer container">
  <p>Built for the Free Fire community · Not affiliated with Garena.</p>
  <a class="footer-admin-link" href="admin.html">Admin Panel →</a>
</footer>

<script src="js/utils.js"></script>
<script src="js/slider.js"></script>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
</body>
</html>
